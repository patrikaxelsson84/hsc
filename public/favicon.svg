<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#FFE066"/>
      <stop offset="40%"  stop-color="#D4920E"/>
      <stop offset="100%" stop-color="#9A6508"/>
    </linearGradient>
  </defs>
  <!--
    Classic horseshoe: thick U-arch, open at bottom, no nail holes.
    Outer radius 36, inner radius 20, center at (50, 44).
    Legs run straight down to y=94.
  -->
  <path
    fill="url(#gold)"
    d="
      M 14,94
      L 14,44
      A 36,36 0 0,1 86,44
      L 86,94
      L 70,94
      L 70,44
      A 20,20 0 0,0 30,44
      L 30,94
      Z
    "
  />
</svg>
